name: Build and Test
on:
  workflow_call:

  workflow_dispatch:
    inputs:
      skip-tests:
        description: 'Skip the test execution step?'
        type: string
        required: false
        default: 'false'
      skip-style-check:
        description: 'Skip the style check step?'
        type: string
        required: false
        default: 'false'

jobs:
  build-test:
    name: Build and Test (Java ${{ matrix.java }})
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    strategy:
      matrix:
        include:
          - java: 21
            test-args: --continue
          - java: 25
            test-args: --continue
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: |
            25
            21
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.0.1

      - name: Build with Gradle
        run: |
          ./gradlew clean develop -PjavaVersion=${{ matrix.java }}
        working-directory: symmetric-assemble

      - name: Test with Gradle
        if: ${{ inputs.skip-tests != 'true' }}
        run: |
          ./gradlew test codeCoverageReport -PjavaVersion=${{ matrix.java }} ${{ matrix.test-args }}
        working-directory: symmetric-assemble

      - name: Style check with Gradle
        if: ${{ inputs.skip-style-check != 'true' }}
        run: |
          ./gradlew spotlessJavaCheck -PjavaVersion=${{ matrix.java }}
        working-directory: symmetric-assemble

      - name: Upload JaCoCo unit test coverage report
        if: ${{ inputs.skip-tests != 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jacoco-unit-test-coverage-report-java-${{ matrix.java }}
          path: symmetric-assemble/build/reports/jacoco/codeCoverageReport/
          retention-days: 3

  build-test-result:
    name: Build and Test
    needs: build-test
    if: always()
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    steps:
      - run: test "${{ needs.build-test.result }}" = "success"
